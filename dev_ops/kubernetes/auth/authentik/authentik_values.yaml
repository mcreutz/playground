authentik:
  secret_key: "PleaseGenerateASecureKey"
  postgresql:
    password: "ThisIsNotASecurePassword"

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - authentik.server03.creutz.io
    tls:
      - secretName: tls-authentik-server03-creutz-io
        hosts:
          - "authentik.server03.creutz.io"

postgresql:
  enabled: true
  auth:
    password: "ThisIsNotASecurePassword"

# Connected apps are declared statically in connected_apps_blueprint.yaml and
# loaded by the chart natively (mounted into the worker, applied automatically).
# Apply that ConfigMap before installing. To add an app, edit the blueprint and
# re-apply.
blueprints:
  configMaps:
    - authentik-connected-apps
